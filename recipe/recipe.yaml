schema_version: 1

context:
  version: "0.11.0"

package:
  name: gofumpt
  version: ${{ version }}

source:
  url: https://github.com/mvdan/gofumpt/archive/v${{ version }}.tar.gz
  sha256: 9151983838fa3fbca5a83e3b302e81c68c61e393cb9d3b7e4c297df311bbf394

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - gofumpt --help

about:
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - license-files/
  summary: Stricter gofmt
  homepage: https://github.com/mvdan/gofumpt
  repository: https://github.com/mvdan/gofumpt

extra:
  recipe-maintainers:
    - danielnachun
