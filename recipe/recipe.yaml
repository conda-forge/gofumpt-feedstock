schema_version: 1

context:
  version: "0.12.0"

package:
  name: gofumpt
  version: ${{ version }}

source:
  url: https://github.com/mvdan/gofumpt/archive/v${{ version }}.tar.gz
  sha256: b6d5d14692cad23996da4329bf24d30324af30125dd5261e6d9b0c5bc8b20b28

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - gofumpt --help

about:
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - license-files/
  summary: Stricter gofmt
  homepage: https://github.com/mvdan/gofumpt
  repository: https://github.com/mvdan/gofumpt

extra:
  recipe-maintainers:
    - danielnachun
